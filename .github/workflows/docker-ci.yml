name: Docker CI

on:
  push:
    branches:
      - main
      - ci-**
  pull_request:
    branches:
      - main

jobs:
  build-and-test-server:
    name: Build & Test Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build Server Docker image
        run: docker build -t embeddingsearch-server -f src/Server/Dockerfile .

      - name: Smoke test Server container
        run: |
          docker run -d --name server-test \
            -p 5146:5146 \
            -e ASPNETCORE_ENVIRONMENT=Docker \
            embeddingsearch-server

          # Wait up to 15s for the process to bind
          for i in $(seq 1 15); do
            if curl -sf http://localhost:5146/healthz > /dev/null 2>&1; then
              echo "Server responded on /healthz"
              exit 0
            fi
            # Check container is still running
            if ! docker ps --filter name=server-test --format "{{.Status}}" | grep -q Up; then
              echo "Container stopped unexpectedly"
              docker logs server-test
              exit 1
            fi
            sleep 1
          done
          echo "Server failed to respond within 15s"
          docker logs server-test
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f server-test 2>/dev/null || true

  build-and-test-indexer:
    name: Build & Test Indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build Indexer Docker image
        run: docker build -t embeddingsearch-indexer -f src/Indexer/Dockerfile .

      - name: Smoke test Indexer container
        run: |
          docker run -d --name indexer-test \
            -p 5120:5120 \
            -e ASPNETCORE_ENVIRONMENT=Docker \
            embeddingsearch-indexer

          for i in $(seq 1 15); do
            if curl -sf http://localhost:5120/healthz > /dev/null 2>&1; then
              echo "Indexer responded on /healthz"
              exit 0
            fi
            if ! docker ps --filter name=indexer-test --format "{{.Status}}" | grep -q Up; then
              echo "Container stopped unexpectedly"
              docker logs indexer-test
              exit 1
            fi
            sleep 1
          done
          echo "Indexer failed to respond within 15s"
          docker logs indexer-test
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f indexer-test 2>/dev/null || true
